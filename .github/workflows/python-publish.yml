# Builds the Python package and uploads it to PyPI with Twine.
# Run by hand only (Actions -> Upload Python Package -> Run workflow): in this fork a GitHub
# release must not publish anything, the asterix_decoder package on PyPI belongs to the
# original project. Needs a PYPI_TOKEN secret for a package name this fork owns.

name: Upload Python Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
    - name: Build and publish
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python setup.py sdist
        twine upload dist/*
